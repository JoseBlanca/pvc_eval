[project]
name = "pvc-eval"
version = "0.1.0"
description = "Compares two VCF files over a reference genome, haplotype by haplotype"
readme = "README.md"
authors = [
    { name = "Jose Blanca", email = "jblanca@upv.es" }
]
requires-python = ">=3.15"
dependencies = []

[project.scripts]
pvc_eval = "pvc_eval.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.2",
    "pytest>=9,<10",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
include = ["*.py", "*.pyi"]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RET", "RSE", "BLE",
          "TRY", "PIE", "PERF", "T20", "PT", "N", "A", "ARG", "ERA", "RUF"]
ignore = ["E501", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"src/pvc_eval/cli.py" = ["T20"]

[tool.ty.terminal]
error-on-warning = true

[tool.pytest]
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
strict = true
markers = ["slow: takes more than a few seconds; deselect with -m 'not slow'"]

[tool.coverage.run]
source = ["pvc_eval"]
branch = true
